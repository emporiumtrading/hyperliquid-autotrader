[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperliquid-autotrader"
version = "0.1.0"
description = "Hyperliquid autonomous trader with regime detection and risk guardrails"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "websockets>=12.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "structlog>=23.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "black", "responses"]
postgres = ["psycopg2-binary>=2.9"]
monitoring = ["prometheus-client>=0.19"]

[project.scripts]
autotrader = "autotrader.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
